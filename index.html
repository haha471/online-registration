<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三德精舍 法會雲端登記表</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f5f2eb;
            color: #333;
            font-family: "Microsoft JhengHei", sans-serif;
            font-size: 17px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .main-title {
            text-align: center;
            color: #8b1e1e;
            font-size: 30px;
            margin: 15px 0 30px;
        }

        .section {
            background: #fff;
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            color: #8b1e1e;
            font-size: 22px;
            margin: 0 0 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8d5bd;
        }

        .hint {
            color: #666;
            font-size: 15px;
            line-height: 1.7;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .option-card {
            border: 2px solid #e0d2c0;
            border-radius: 10px;
            padding: 18px 12px;
            text-align: center;
            background: #fffdf9;
        }

        .option-card label {
            display: block;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }

        .option-card input {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 6px;
        }

        .option-description {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="tel"],
        select {
            width: 100%;
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 17px;
            background: #fff;
        }

        .contact-row,
        .address-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .checkbox-card {
            border: 2px solid #e0d2c0;
            border-radius: 10px;
            padding: 18px;
            background: #fffdf9;
        }

        .checkbox-card label {
            cursor: pointer;
            font-size: 19px;
            font-weight: bold;
        }

        .checkbox-card input {
            width: 22px;
            height: 22px;
            vertical-align: middle;
            margin-right: 8px;
        }

        .address-mode {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            background: #fafafa;
        }

        .address-mode label {
            display: block;
            margin-bottom: 12px;
        }

        .stats-box {
            text-align: center;
            background: #fff8e8;
            border: 2px solid #d8bd82;
            border-radius: 12px;
            padding: 25px 15px;
        }

        .stats-label {
            font-size: 19px;
            font-weight: bold;
        }

        .stats-number {
            color: #8b1e1e;
            font-size: 42px;
            font-weight: bold;
            margin-top: 10px;
        }

        .disaster-entry {
            border: 1px solid #e0d2c0;
            border-radius: 10px;
            padding: 16px;
            margin: 14px 0;
            background: #fffdf9;
        }

        .disaster-entry-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .disaster-entry h3 {
            margin: 0;
            color: #8b1e1e;
            font-size: 18px;
        }

        .disaster-name-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        @media (max-width: 600px) {
            .disaster-name-row {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
        }

        .household-name-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .household-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .household-name-row input {
            flex: 1;
            min-width: 0;
        }

        .add-household-name {
            background: #426b54;
            color: white;
            margin-top: 8px;
            padding: 9px 12px;
            font-size: 15px;
        }

        .remove-household-name {
            background: #eee;
            color: #333;
            padding: 8px 11px;
            font-size: 14px;
            white-space: nowrap;
        }

        .same-writer-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: normal;
            color: #333;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        #addDisaster {
            background: #8b1e1e;
            color: white;
        }

        .remove-disaster {
            background: #eee;
            color: #333;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
                font-size: 17px;
            }

            .main-title {
                font-size: 25px;
                line-height: 1.5;
            }

            .section {
                padding: 17px;
            }

            .section-title {
                font-size: 20px;
            }

            .option-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .option-card {
                padding: 15px 6px;
            }

            .option-card label {
                font-size: 16px;
            }

            .contact-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .address-row {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1 class="main-title">三德精舍 法會雲端登記表</h1>

        <!-- 類別 1：牌位種類 -->
        <section class="section">
            <h2 class="section-title">類別 1：牌位種類</h2>

            <p class="hint">請選擇一種需要登記的牌位種類。</p>

            <div class="option-grid">

                <div class="option-card">
                    <label>
                        <input type="radio" name="tabletType" value="大牌位">
                        大牌位
                    </label>
                </div>

                <div class="option-card">
                    <label>
                        <input type="radio" name="tabletType" value="中牌位">
                        中牌位
                    </label>
                </div>

                <div class="option-card">
                    <label>
                        <input type="radio" name="tabletType" value="小牌位">
                        小牌位
                    </label>
                </div>

                <div class="option-card">
                    <label>
                        <input type="radio" name="tabletType" value="全家牌位">
                        全家牌位
                    </label>
                    <div class="option-description">
                        消災與超薦合計 30 支
                    </div>
                </div>

            </div>
        </section>

        <!-- 類別 2：牌位填寫人資料 -->
        <section class="section">
            <h2 class="section-title">類別 2：牌位填寫人資料</h2>

            <div class="contact-row">

                <div class="form-group">
                    <label for="writerName">寫牌位者姓名</label>
                    <input
                        type="text"
                        id="writerName"
                        placeholder="請輸入姓名"
                    >
                </div>

                <div class="form-group">
                    <label for="writerPhone">手機號碼</label>
                    <input
                        type="tel"
                        id="writerPhone"
                        placeholder="請輸入手機號碼"
                    >
                </div>

            </div>

            <div class="address-row">
                <div class="form-group">
                    <label for="mainCity">縣市</label>

                    <select id="mainCity">
                        <option value="">請選擇縣市</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mainDistrict">鄉鎮市區</label>

                    <select id="mainDistrict">
                        <option value="">請先選擇縣市</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="mainAddress">詳細地址</label>

                <input
                    type="text"
                    id="mainAddress"
                    placeholder="請輸入路名、巷弄及門牌號碼"
                >
            </div>
        </section>

        <!-- 類別 3：消災代表 -->
        <section class="section">
            <h2 class="section-title">類別 3：消災代表</h2>

            <div class="checkbox-card">
                <label>
                    <input
                        type="checkbox"
                        id="enableDisaster"
                    >
                    消災牌位
                </label>

                <p class="hint">
                    勾選消災牌位後，才能開始新增消災代表資料。
                </p>
            </div>

            <div id="disasterArea" hidden>
                <p class="hint">
                    請填寫消災代表姓名與住址。同一住址只計算一張消災牌位。
                </p>

                <div id="disasterList"></div>

                <div class="button-row">
                    <button type="button" id="addDisaster">
                        ＋ 新增消災代表
                    </button>
                </div>
            </div>
        </section>

        <!-- 類別 4：牌位數量統計 -->
        <section class="section">
            <h2 class="section-title">類別 4：牌位數量統計</h2>

            <div class="stats-box">
                <div class="stats-label">
                    消災牌位總數
                </div>

                <div class="stats-number" id="disasterCount">
                    0
                </div>

                <p class="hint">
                    以不同住址為統計單位，同一戶只計算一張。
                </p>
            </div>
        </section>

        <!-- 類別 5：送出登記 -->
        <section class="section">
            <h2 class="section-title">類別 5：送出登記</h2>
            <p class="hint">送出前請確認牌位種類、填寫人資料及消災代表資料。</p>
            <div id="submitStatus" class="hint" role="status" aria-live="polite"></div>
            <button type="button" id="submitRegistration" style="background:#8b1e1e;color:#fff;font-weight:bold;padding:14px 22px;">送出登記</button>
        </section>

        <iframe name="registrationResponseFrame" id="registrationResponseFrame" title="登記回覆" hidden></iframe>
        <form id="registrationTransportForm" method="post" target="registrationResponseFrame" action="https://script.google.com/macros/s/AKfycbzlXWZ32YgkcOGkkHdEoJ03f3dl0Br8ezB2vB613_MbNLLzuDctMRaJhMzctQwf6cPo/exec" hidden>
            <input type="hidden" name="payload" id="registrationPayload">
        </form>

    </div>

    <script>
        const enableDisaster = document.getElementById("enableDisaster");
        const disasterArea = document.getElementById("disasterArea");
        const disasterList = document.getElementById("disasterList");
        const addDisasterButton = document.getElementById("addDisaster");
        const disasterCount = document.getElementById("disasterCount");

        // 勾選消災牌位後才顯示資料區；取消勾選時清空資料並重設統計。
        enableDisaster.addEventListener("change", () => {
            disasterArea.hidden = !enableDisaster.checked;

            if (enableDisaster.checked && disasterList.children.length === 0) {
                addDisasterEntry();
            }

            if (!enableDisaster.checked) {
                disasterList.innerHTML = "";
                updateDisasterCount();
            }
        });

        // 新增一筆消災代表資料。
        addDisasterButton.addEventListener("click", addDisasterEntry);

        function addDisasterEntry() {
            const number = disasterList.children.length + 1;
            const entry = document.createElement("div");
            entry.className = "disaster-entry";

            entry.innerHTML = `
                <div class="disaster-entry-heading">
                    <h3>消災代表 ${number}</h3>
                    <label class="same-writer-label">
                        <input type="checkbox" class="same-as-writer">
                        同牌位填寫人
                    </label>
                </div>
                <div class="disaster-name-row">
                    <div class="form-group">
                        <label>消災代表姓名</label>
                        <input type="text" class="disaster-name" placeholder="請輸入消災代表姓名">
                    </div>
                    <div class="form-group">
                        <label>同戶姓名</label>
                        <div class="household-name-list">
                            <div class="household-name-row">
                                <input type="text" class="same-household-names" placeholder="請輸入同戶姓名（選填）">
                            </div>
                        </div>
                        <button type="button" class="add-household-name">＋ 新增住戶</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" class="use-main-address">
                        同主要地址
                    </label>
                </div>

                <div class="main-address-preview" hidden>
                    <p class="hint">此筆將使用類別 2 填寫的主要地址：</p>
                    <div class="address-preview-text"></div>
                </div>

                <div class="custom-disaster-address">
                    <p class="hint">或自行填寫此消災代表的住址（選填，不必填寫完整也可先繼續）。</p>
                    <div class="address-row">
                        <div class="form-group">
                            <label>縣市</label>
                            <select class="disaster-city">
                                <option value="">請選擇縣市</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>鄉鎮市區</label>
                            <select class="disaster-district">
                                <option value="">請先選擇縣市</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>詳細地址</label>
                        <input type="text" class="disaster-detail-address" placeholder="請輸入路名、巷弄及門牌號碼（選填）">
                    </div>
                </div>

                <div class="button-row">
                    <button type="button" class="remove-disaster">刪除此筆</button>
                </div>
            `;

            const useMainAddress = entry.querySelector(".use-main-address");
            const sameAsWriter = entry.querySelector(".same-as-writer");
            const disasterName = entry.querySelector(".disaster-name");
            const mainAddressPreview = entry.querySelector(".main-address-preview");
            const customAddressArea = entry.querySelector(".custom-disaster-address");

            function refreshAddressMode() {
                const useMain = useMainAddress.checked;
                mainAddressPreview.hidden = !useMain;
                customAddressArea.hidden = useMain;
                entry.querySelector(".address-preview-text").textContent = getMainAddress() || "尚未填寫類別 2 的主要地址";
                updateDisasterCount();
            }

            function applyWriterData() {
                if (sameAsWriter.checked) {
                    disasterName.value = document.getElementById("writerName").value;
                    useMainAddress.checked = true;
                    useMainAddress.disabled = true;
                } else {
                    useMainAddress.disabled = false;
                }
                refreshAddressMode();
            }

            sameAsWriter.addEventListener("change", applyWriterData);
            useMainAddress.addEventListener("change", refreshAddressMode);

            const householdNameList = entry.querySelector(".household-name-list");
            entry.querySelector(".add-household-name").addEventListener("click", () => {
                const row = document.createElement("div");
                row.className = "household-name-row";
                row.innerHTML = `
                    <input type="text" class="same-household-names" placeholder="請輸入同戶姓名（選填）">
                    <button type="button" class="remove-household-name">移除</button>
                `;
                row.querySelector(".remove-household-name").addEventListener("click", () => row.remove());
                householdNameList.appendChild(row);
                row.querySelector("input").focus();
            });
            entry.querySelectorAll(".disaster-city, .disaster-district, .disaster-detail-address").forEach(input => {
                input.addEventListener("input", updateDisasterCount);
                input.addEventListener("change", updateDisasterCount);
            });
            entry.querySelector(".remove-disaster").addEventListener("click", () => {
                entry.remove();
                renumberDisasterEntries();
                updateDisasterCount();
            });

            disasterList.appendChild(entry);
            renumberDisasterEntries();
            refreshAddressMode();
            updateDisasterCount();
        }

        // 將類別 2 的主要地址組合成一段文字；空白欄位不會被強制要求填寫。
        function getMainAddress() {
            return [
                document.getElementById("mainCity").value,
                document.getElementById("mainDistrict").value,
                document.getElementById("mainAddress").value
            ].filter(value => value && value.trim()).join("");
        }

        // 組合自行填寫的消災地址，格式與類別 2 相同。
        function getCustomDisasterAddress(entry) {
            return [
                entry.querySelector(".disaster-city").value,
                entry.querySelector(".disaster-district").value,
                entry.querySelector(".disaster-detail-address").value
            ].filter(value => value && value.trim()).join("");
        }

        // 重新編號，避免刪除資料後編號跳號。
        function renumberDisasterEntries() {
            [...disasterList.querySelectorAll(".disaster-entry h3")].forEach((heading, index) => {
                heading.textContent = `消災代表 ${index + 1}`;
            });
        }


        // 類別 2 的主要地址變更時，同步更新已勾選「使用主要地址」的消災代表。
        ["mainCity", "mainDistrict", "mainAddress"].forEach(id => {
            const field = document.getElementById(id);
            field.addEventListener("input", refreshMainAddressPreviews);
            field.addEventListener("change", refreshMainAddressPreviews);
        });

        // 牌位填寫人姓名變更時，同步更新已勾選「同牌位填寫人」的消災代表。
        document.getElementById("writerName").addEventListener("input", refreshWriterData);
        document.getElementById("writerName").addEventListener("change", refreshWriterData);

        function refreshWriterData() {
            disasterList.querySelectorAll(".disaster-entry").forEach(entry => {
                if (entry.querySelector(".same-as-writer").checked) {
                    entry.querySelector(".disaster-name").value = document.getElementById("writerName").value;
                }
            });
        }

        function refreshMainAddressPreviews() {
            disasterList.querySelectorAll(".disaster-entry").forEach(entry => {
                if (entry.querySelector(".use-main-address").checked) {
                    entry.querySelector(".address-preview-text").textContent = getMainAddress() || "尚未填寫類別 2 的主要地址";
                }
            });
            updateDisasterCount();
        }

        // 統計不同住址；忽略空白地址，並排除前後空格及空格格式差異。
        function normalizeAddress(address) {
            return address
                .normalize("NFKC")
                .replace(/[\s　]+/g, "")
                .trim();
        }

        function updateDisasterCount() {
            if (!enableDisaster.checked) {
                disasterCount.textContent = "0";
                return;
            }

            const uniqueAddresses = new Set();

            disasterList.querySelectorAll(".disaster-entry").forEach(entry => {
                const useMainAddress = entry.querySelector(".use-main-address").checked;
                const rawAddress = useMainAddress ? getMainAddress() : getCustomDisasterAddress(entry);
                const address = normalizeAddress(rawAddress);
                if (address) uniqueAddresses.add(address);
            });

            disasterCount.textContent = uniqueAddresses.size;
        }

        // 縣市／鄉鎮市區選單資料
        const districtOptions = {
            "臺北市": "中正區,大同區,中山區,松山區,大安區,萬華區,信義區,士林區,北投區,內湖區,南港區,文山區",
            "新北市": "板橋區,三重區,中和區,永和區,新莊區,新店區,土城區,蘆洲區,汐止區,樹林區,淡水區,鶯歌區,三峽區,林口區,五股區,泰山區,八里區,深坑區,石碇區,坪林區,三芝區,石門區,金山區,萬里區,瑞芳區,貢寮區,雙溪區,平溪區,烏來區",
            "基隆市": "仁愛區,信義區,中正區,中山區,安樂區,暖暖區,七堵區",
            "桃園市": "桃園區,中壢區,大溪區,楊梅區,蘆竹區,大園區,龜山區,八德區,龍潭區,平鎮區,新屋區,觀音區,復興區",
            "新竹市": "東區,北區,香山區",
            "新竹縣": "竹北市,竹東鎮,新埔鎮,關西鎮,湖口鄉,新豐鄉,芎林鄉,寶山鄉,北埔鄉,峨眉鄉,尖石鄉,五峰鄉,橫山鄉",
            "苗栗縣": "苗栗市,頭份市,竹南鎮,後龍鎮,通霄鎮,苑裡鎮,卓蘭鎮,造橋鄉,西湖鄉,頭屋鄉,公館鄉,銅鑼鄉,三義鄉,大湖鄉,獅潭鄉,三灣鄉,南庄鄉,泰安鄉",
            "臺中市": "中區,東區,南區,西區,北區,北屯區,西屯區,南屯區,太平區,大里區,霧峰區,烏日區,豐原區,后里區,石岡區,東勢區,新社區,潭子區,大雅區,神岡區,大肚區,沙鹿區,龍井區,梧棲區,清水區,大甲區,外埔區,大安區,和平區",
            "彰化縣": "彰化市,員林市,鹿港鎮,和美鎮,溪湖鎮,田中鎮,北斗鎮,二林鎮,花壇鄉,芬園鄉,大村鄉,永靖鄉,伸港鄉,線西鄉,福興鄉,秀水鄉,埔心鄉,埔鹽鄉,大城鄉,芳苑鄉,竹塘鄉,埤頭鄉,溪州鄉,田尾鄉,社頭鄉,二水鄉",

            "宜蘭縣": "宜蘭市,羅東鎮,蘇澳鎮,頭城鎮,礁溪鄉,壯圍鄉,員山鄉,冬山鄉,五結鄉,三星鄉,大同鄉,南澳鄉",
            "花蓮縣": "花蓮市,鳳林鎮,玉里鎮,新城鄉,吉安鄉,壽豐鄉,光復鄉,豐濱鄉,瑞穗鄉,富里鄉,秀林鄉,萬榮鄉,卓溪鄉",
            "臺東縣": "臺東市,成功鎮,關山鎮,卑南鄉,鹿野鄉,池上鄉,東河鄉,長濱鄉,太麻里鄉,大武鄉,綠島鄉,海端鄉,延平鄉,金峰鄉,達仁鄉,蘭嶼鄉",

        const cityNames = Object.keys(districtOptions);

        function populateCity(select) {
            const oldValue = select.value;
            select.innerHTML = '<option value="">請選擇縣市</option>' + cityNames.map(city => `<option value="${city}">${city}</option>`).join('');
            if (cityNames.includes(oldValue)) select.value = oldValue;
        }
        function populateDistrict(citySelect, districtSelect) {
            const oldValue = districtSelect.value;
            const districts = (districtOptions[citySelect.value] || '').split(',').filter(Boolean);
            districtSelect.innerHTML = '<option value="">請選擇鄉鎮市區</option>' + districts.map(d => `<option value="${d}">${d}</option>`).join('');
            if (districts.includes(oldValue)) districtSelect.value = oldValue;
        }
        function setupAddressDropdowns(root = document) {
            const pairs = [];
            if (root === document) pairs.push([document.getElementById('mainCity'), document.getElementById('mainDistrict')]);
            root.querySelectorAll('.disaster-city').forEach(city => pairs.push([city, city.closest('.custom-disaster-address').querySelector('.disaster-district')]));
            pairs.forEach(([city, district]) => {
                if (!city || !district || city.dataset.ready === '1') return;
                city.dataset.ready = '1';
                populateCity(city);
                populateDistrict(city, district);
                city.addEventListener('change', () => { populateDistrict(city, district); updateDisasterCount(); });
                district.addEventListener('change', updateDisasterCount);
            });
        }
        setupAddressDropdowns();
        const addressObserver = new MutationObserver(() => setupAddressDropdowns(disasterList));
        addressObserver.observe(disasterList, {childList: true});

        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzlXWZ32YgkcOGkkHdEoJ03f3dl0Br8ezB2vB613_MbNLLzuDctMRaJhMzctQwf6cPo/exec';
        const submitButton = document.getElementById('submitRegistration');
        const submitStatus = document.getElementById('submitStatus');
        const transportForm = document.getElementById('registrationTransportForm');
        const transportPayload = document.getElementById('registrationPayload');
        let submitInProgress = false;
        let submitTimeout;

        function collectRegistrationPayload() {
            const tablet = document.querySelector('input[name="tabletType"]:checked');
            const writerName = document.getElementById('writerName').value.trim();
            const writerPhone = document.getElementById('writerPhone').value.trim();
            const mainCity = document.getElementById('mainCity').value;
            const mainDistrict = document.getElementById('mainDistrict').value;
            const mainAddress = document.getElementById('mainAddress').value.trim();
            const disasterEntries = [];
            if (!tablet) throw new Error('請先選擇牌位種類。');
            if (!writerName) throw new Error('請填寫牌位填寫人姓名。');
            if (!writerPhone) throw new Error('請填寫聯絡電話。');
            if (enableDisaster.checked) {
                const entries = [...disasterList.querySelectorAll('.disaster-entry')];
                if (!entries.length) throw new Error('請至少新增一筆消災代表。');
                entries.forEach((entry, index) => {
                    const name = entry.querySelector('.disaster-name').value.trim();
                    if (!name) throw new Error(`請填寫「消災代表 ${index + 1}」姓名。`);
                    const useMainAddress = entry.querySelector('.use-main-address').checked;
                    const city = useMainAddress ? mainCity : entry.querySelector('.disaster-city').value;
                    const district = useMainAddress ? mainDistrict : entry.querySelector('.disaster-district').value;
                    const detailAddress = useMainAddress ? mainAddress : entry.querySelector('.disaster-detail-address').value.trim();
                    const address = [city, district, detailAddress].filter(Boolean).join('');
                    if (!address) throw new Error(`請為「消災代表 ${index + 1}」選擇同主要地址，或填寫住址。`);
                    const householdNames = [...entry.querySelectorAll('.same-household-names')].map(input => input.value.trim()).filter(Boolean);
                    disasterEntries.push({name, householdNames, city, district, detailAddress, address, useMainAddress});
                });
            }
            return {writerName, writerPhone, tabletType: tablet.value, mainCity, mainDistrict, mainAddress, registrationItems: enableDisaster.checked ? ['消災'] : [], disasterEntries};
        }

        submitButton.addEventListener('click', () => {
            if (submitInProgress) return;
            let payload;
            try { payload = collectRegistrationPayload(); }
            catch (error) { submitStatus.textContent = error.message; submitStatus.style.color = '#b00020'; return; }
            submitInProgress = true;
            submitButton.disabled = true;
            submitButton.textContent = '正在送出…';
            submitStatus.textContent = '正在送出登記資料，請稍候。';
            submitStatus.style.color = '#555';
            transportPayload.value = JSON.stringify(payload);
            transportForm.action = WEB_APP_URL;
            transportForm.submit();
            clearTimeout(submitTimeout);
            submitTimeout = setTimeout(() => {
                if (!submitInProgress) return;
                submitStatus.textContent = '尚未收到回覆。請先查看試算表是否已新增資料，確認前請勿重複送出。';
                submitStatus.style.color = '#b00020';
                submitButton.disabled = false;
                submitButton.textContent = '重新送出';
                submitInProgress = false;
            }, 20000);
        });

        window.addEventListener('message', event => {
            const data = event.data;
            if (!data || data.type !== 'SANDE_REGISTRATION_RESULT') return;
            clearTimeout(submitTimeout);
            submitInProgress = false;
            submitButton.disabled = false;
            submitButton.textContent = '送出登記';
            if (data.success) {
                const serials = Array.isArray(data.serials) ? [...new Set(data.serials.filter(Boolean))] : [];
                submitStatus.textContent = serials.length ? `登記成功！住址流水號：${serials.join('、')}` : '登記成功！';
                submitStatus.style.color = '#176b37';
            } else {
                submitStatus.textContent = '登記失敗：' + (data.message || '請檢查資料後再試。');
                submitStatus.style.color = '#b00020';
            }
        });
    </script>
