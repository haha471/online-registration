
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三德精舍法會牌位登記表</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 680px;
            margin: 30px auto;
            padding: 16px;
            background-color: #f3f6fb;
            color: #333;
            line-height: 1.6;
        }

        h1, h2 {
            color: #2457a7;
            text-align: center;
        }

        h1 {
            font-size: 26px;
        }

        form, #recordList {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000012;
        }

        .field {
            margin-bottom: 18px;
        }

        .field > label,
        .section-title {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .text-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }


.major-items {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin: 12px 0;
}

.major-option {
    flex-shrink: 0;
}

.disaster-area {
    min-width: 0;
    flex: 1;
}


        .major-option {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-weight: bold;
            cursor: pointer;
        }

        .major-option input,
        .minor-option input {
            width: 18px;
            height: 18px;
            margin: 0;
            flex-shrink: 0;
            accent-color: #2457a7;
        }

        .disaster-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            flex: 1;
        }

        .disaster-area-title {
            font-weight: bold;
        }

        #disasterNames {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .name-row .text-input {
            min-width: 0;
            flex: 1;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #2457a7;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #183e7c;
        }

        .small-button {
            align-self: flex-start;
            padding: 7px 10px;
            font-size: 14px;
        }

        .remove-button {
            background: #777;
            padding: 7px 10px;
        }

        .remove-button:hover {
            background: #555;
        }

        #salvationItems {
            display: none;
            margin: 12px 0 18px 24px;
            padding: 14px;
            background: #f7f9fd;
            border-radius: 8px;
        }

        #salvationItems p {
            margin-top: 0;
            font-weight: bold;
        }

        .minor-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .minor-option {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            line-height: 1.5;
            cursor: pointer;
        }

        .submit-button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            font-size: 17px;
        }

        #message {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #recordList {
            padding-left: 40px;
            overflow-wrap: anywhere;
        }

        #recordList li {
            margin-bottom: 12px;
        }

        @media (max-width: 480px) {
            body {
                margin: 10px auto;
                padding: 10px;
            }

            h1 {
                font-size: 22px;
            }

            form {
                padding: 15px;
            }

            .major-items {
                gap: 12px;
            }

            #salvationItems {
                margin-left: 0;
            }
        }
        
.contact-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}

.contact-row .field {
    flex: 1;
    min-width: 0;
}

.contact-row .text-input {
    box-sizing: border-box;
    width: 100%;
}

@media (max-width: 480px) {
    .contact-row {
        gap: 10px;
    }
}

<body>
    <h1>三德精舍 法會牌位登記表</h1>

    <form id="registrationForm">
        
<div class="field">
    <label>牌位類別：（請擇一）</label>
    <div class="category-options">
        <label>
            <input type="radio" name="tabletCategory" value="大牌位" required>
            大牌位
        </label>

        <label>
            <input type="radio" name="tabletCategory" value="中牌位">
            中牌位
        </label>

        <label>
            <input type="radio" name="tabletCategory" value="小牌位">
            小牌位
        </label>

        <label>
            <input type="radio" name="tabletCategory" value="全家小牌位">
            全家小牌位
        </label>
    </div>
</div>


<div class="contact-row">
    <div class="field">
        <label for="name">寫牌位者：</label>
        <input
            class="text-input"
            type="text"
            id="name"
            name="name"
            placeholder="請輸入寫牌位者姓名"
            required
        >
    </div>

    <div class="field">
        <label for="phone">聯絡電話：</label>
        <input
            class="text-input"
            type="tel"
            id="phone"
            name="phone"
            placeholder="請輸入聯絡電話"
            required
        >
    </div>
</div>




<div class="field">
    <label>主要住址：</label>

    <div class="address-group">
        <label for="city">縣市：</label>
        <select class="text-input" id="city" name="city" required>
            <option value="">請選擇縣市</option>
        </select>

        <label for="district">鄉鎮市區：</label>
        <select class="text-input" id="district" name="district" required disabled>
            <option value="">請先選擇縣市</option>
        </select>

        <label for="detailAddress">詳細地址：</label>
        <input
            class="text-input"
            type="text"
            id="detailAddress"
            name="detailAddress"
            placeholder="請輸入路名、巷弄、門牌號碼"
            required
        >
    </div>
</div>



        <div class="field">
            <div class="section-title">登記項目（可複選）：</div>

            <div class="major-items">
                <label class="major-option">
                    <input
                        type="checkbox"
                        name="majorItem"
                        value="消災"
                        id="disaster"
                    >
                    <span>消災</span>
                </label>

                <div class="disaster-area">
                    <div class="disaster-area-title">消災姓名：</div>

                    <div id="disasterNames">
                        <div class="name-row">
                            <input
                                class="text-input"
                                type="text"
                                name="disasterName"
                                placeholder="請輸入姓名"
                            >
                        </div>
                    </div>

                    <button
                        type="button"
                        class="small-button"
                        id="addDisasterName"
                    >＋新增姓名</button>
                </div>

                <label class="major-option">
                    <input
                        type="checkbox"
                        name="majorItem"
                        value="超薦"
                        id="salvation"
                    >
                    <span>超薦</span>
                </label>
            </div>

            <div id="salvationItems">
                <p>超薦小項目（可複選）：</p>

                <div class="minor-list">
                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-1 個人累世冤親債主">
                        <span>2-1 個人累世冤親債主</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-2 累世今生所食所傷眾生">
                        <span>2-2 累世今生所食所傷眾生</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-3 歷代祖先">
                        <span>2-3 歷代祖先</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-4 地基主">
                        <span>2-4 地基主</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-5 已過世親人">
                        <span>2-5 已過世親人</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-6 墮胎流產嬰靈夭折無緣子女">
                        <span>2-6 墮胎流產嬰靈夭折無緣子女</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-7 其他（寵物）">
                        <span>2-7 其他（寵物）</span>
                    </label>

                    <label class="minor-option">
                        <input type="checkbox" name="minorItem" value="2-8 普桌">
                        <span>2-8 普桌</span>
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="submit-button">送出登記</button>
    </form>

    <p id="message" role="status"></p>

const citySelect = document.getElementById("city");
const districtSelect = document.getElementById("district");

Object.keys(cityDistricts).forEach(function (city) {
    const option = document.createElement("option");
    option.value = city;
    option.textContent = city;
    citySelect.appendChild(option);
});

citySelect.addEventListener("change", function () {
    districtSelect.innerHTML = '<option value="">請選擇鄉鎮市區</option>';

    const districts = cityDistricts[this.value] || [];

    districts.forEach(function (district) {
        const option = document.createElement("option");
        option.value = district;
        option.textContent = district;
        districtSelect.appendChild(option);
    });

    districtSelect.disabled = districts.length === 0;
});


        try {
            records = JSON.parse(
                localStorage.getItem("registrationRecords") || "[]"
            );
        } catch (error) {
            records = [];
        }

        salvationCheckbox.addEventListener("change", function () {
            salvationItems.style.display = this.checked ? "block" : "none";

            if (!this.checked) {
                document.querySelectorAll('input[name="minorItem"]')
                    .forEach(function (checkbox) {
                        checkbox.checked = false;
                    });
            }
        });

        addDisasterNameButton.addEventListener("click", function () {
            const row = document.createElement("div");
            row.className = "name-row";

            const input = document.createElement("input");
            input.type = "text";
            input.name = "disasterName";
            input.className = "text-input";
            input.placeholder = "請輸入姓名";

            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "remove-button";
            removeButton.textContent = "刪除";
            removeButton.setAttribute("aria-label", "刪除此姓名欄位");

            removeButton.addEventListener("click", function () {
                row.remove();
            });

            row.appendChild(input);
            row.appendChild(removeButton);
            disasterNames.appendChild(row);
            input.focus();
        });

        function showRecords() {
            recordList.replaceChildren();

            records.forEach(function (record) {
                const li = document.createElement("li");

                li.textContent =
                    "寫牌位者：" + (record.name || "") +
                    "｜電話：" + (record.phone || "") +
                    "｜地址：" + (record.address || "") +
                    "｜登記項目：" + (record.item || "");

                recordList.appendChild(li);
            });
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const selectedMajorItems = Array.from(
                document.querySelectorAll('input[name="majorItem"]:checked')
            ).map(function (checkbox) {
                return checkbox.value;
            });

            const selectedMinorItems = Array.from(
                document.querySelectorAll('input[name="minorItem"]:checked')
            ).map(function (checkbox) {
                return checkbox.value;
            });

            if (selectedMajorItems.length === 0) {
                message.textContent = "請至少勾選一個登記項目。";
                return;
            }

            const names = Array.from(
                document.querySelectorAll('input[name="disasterName"]')
            ).map(function (input) {
                return input.value.trim();
            }).filter(Boolean);

            if (selectedMajorItems.includes("消災") && names.length === 0) {
                message.textContent = "已勾選消災，請至少填寫一位消災姓名。";
                return;
            }

            const itemDetails = [];

            if (selectedMajorItems.includes("消災")) {
                itemDetails.push("消災（姓名：" + names.join("、") + "）");
            }

            if (selectedMajorItems.includes("超薦")) {
                itemDetails.push(
                    "超薦" +
                    (selectedMinorItems.length
                        ? "（" + selectedMinorItems.join("、") + "）"
                        : "")
                );
            }

            const record = {
                name: document.getElementById("name").value.trim(),
                tabletCategory: document.querySelector('input[name="tabletCategory"]:checked').value,
                phone: document.getElementById("phone").value.trim(),
                address: [
    document.getElementById("city").value,
    document.getElementById("district").value,
    document.getElementById("detailAddress").value.trim()
].filter(Boolean).join(""),
                disasterNames: selectedMajorItems.includes("消災") ? names : [],
                item: itemDetails.join("；")
            };

            message.textContent = "正在送出登記，請稍候……";

            try {
                await fetch(scriptUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(record)
                });

                records.push(record);
                localStorage.setItem(
                    "registrationRecords",
                    JSON.stringify(records)
                );

                showRecords();
                message.textContent =
                    "登記資料已送出。請再確認 Google 試算表是否收到資料。";

                form.reset();
                districtSelect.innerHTML = '<option value="">請先選擇縣市</option>';
                districtSelect.disabled = true;

                disasterNames.innerHTML = `
                    <div class="name-row">
                        <input
                            class="text-input"
                            type="text"
                            name="disasterName"
                            placeholder="請輸入姓名"
                        >
                    </div>
                `;
                salvationItems.style.display = "none";

            } catch (error) {
                message.textContent =
                    "無法送出資料，請檢查網路連線後再試。";
            }
        });

        showRecords();
    </script>
</body>
</html>
