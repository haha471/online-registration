
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三德精舍法會牌位登記表</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            max-width: 680px;
            margin: 30px auto;
            padding: 16px;
            background-color: #f3f6fb;
            color: #333;
            line-height: 1.6;
        }

        h1, h2 {
            color: #2457a7;
            text-align: center;
        }

        h1 {
            font-size: 26px;
            line-height: 1.35;
        }

        h1 span {
            display: block;
        }

        h1 span + span {
            margin-top: 2px;
        }

        form, #recordList {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000012;
        }

        .field {
            margin-bottom: 18px;
        }
        .address-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

.address-group label {
    white-space: nowrap;
}

.address-group select {
    width: auto;
    flex: 1;
    min-width: 120px;
}

        .field > label,
        .section-title {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .text-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
.detail-address-input {
    width: 100%;
    flex: 1;
    min-width: 0;
    box-sizing: border-box;
    padding: 12px;
}

.address-group .detail-address-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.address-group .detail-address-row label {
    flex: 0 0 auto;
    white-space: nowrap;
    margin: 0;
}

.address-group .detail-address-row .detail-address-input {
    flex: 1;
    width: 0;
    min-width: 0;
    box-sizing: border-box;
}

.major-items {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    margin: 12px 0;
}

.major-option {
    flex-shrink: 0;
}

.disaster-area {
    min-width: 0;
    flex: 1;
}


        .major-option {
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #9bb6d8;
            border-radius: 12px;
            background: #f7faff;
            color: #1f3f68;
            font-size: 20px;
            line-height: 1.4;
            transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
        }

        .major-option:hover {
            border-color: #2457a7;
            background: #edf4ff;
        }

        /* 勾選消災／超薦後，以明顯底色、粗框與狀態標籤提示 */
        .major-option:has(input:checked) {
            border: 3px solid #174f9c;
            background: #e3efff;
            color: #123d78;
            box-shadow: 0 0 0 3px #2457a71c;
        }

        .major-option:has(input:checked)::after {
            content: "已勾選";
            margin-left: auto;
            padding: 3px 9px;
            border-radius: 999px;
            background: #174f9c;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .03em;
        }

        .major-option input {
            width: 26px;
            height: 26px;
            accent-color: #174f9c;
            flex: 0 0 26px;
            cursor: pointer;
        }

        @media (max-width: 480px) {
            .major-option {
                padding: 12px;
                font-size: 18px;
            }
            .major-option input {
                width: 24px;
                height: 24px;
                flex-basis: 24px;
            }
        }

        .major-option input,
        .minor-option input {
            width: 18px;
            height: 18px;
            margin: 0;
            flex-shrink: 0;
            accent-color: #2457a7;
        }

        .disaster-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 180px;
            flex: 1;
        }

        .disaster-area-title {
            font-weight: bold;
        }

        #disasterNames {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }



.name-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    width: 100%;
    margin-bottom: 24px;
    padding: 20px;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 10px;
    background-color: #fff;
    min-height: 220px;
}


.name-row > input.text-input {
    width: 100%;
    box-sizing: border-box;
}


.disaster-address-options {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
    padding: 4px;
}


.disaster-address-options label {
    display: flex;
    align-items: center;
    gap: 8px;
}

.main-address-display,
.other-address-input {
    width: 100%;
    box-sizing: border-box;
    overflow-wrap: anywhere;
}

.name-row .remove-button {
    align-self: flex-end;
}


        .name-row .text-input {
            min-width: 0;
            flex: 1;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #2457a7;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #183e7c;
        }

        .small-button {
            align-self: flex-start;
            padding: 7px 10px;
            font-size: 14px;
        }

        .remove-button {
            background: #777;
            padding: 7px 10px;
        }

        .remove-button:hover {
            background: #555;
        }

        #salvationItems {
            display: none;
            margin: 12px 0 18px 24px;
            padding: 14px;
            background: #f7f9fd;
            border-radius: 8px;
        }

        #salvationItems p {
            margin-top: 0;
            font-weight: bold;
        }

        .minor-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .minor-option {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            line-height: 1.5;
            cursor: pointer;
        }

        .submit-button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            font-size: 17px;
        }

        #message {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        #recordList {
            padding-left: 40px;
            overflow-wrap: anywhere;
        }

        #recordList li {
            margin-bottom: 12px;
        }

        @media (max-width: 480px) {
            body {
                margin: 10px auto;
                padding: 10px;
            }

            h1 {
                font-size: 22px;
            }

            form {
                padding: 15px;
            }

            .major-items {
                gap: 12px;
            }

            #salvationItems {
                margin-left: 0;
            }
        }
        
.contact-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}

.contact-row .field {
    flex: 1;
    min-width: 0;
}

.contact-row .text-input {
    box-sizing: border-box;
    width: 100%;
}

@media (max-width: 480px) {
    .contact-row {
        gap: 10px;
    }
}
.contact-address-section {
    border: 2px solid #9bbad0;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    background-color: #eef6fc;
}
.contact-address-section .section-title {
    margin-top: 0;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid #ddd;
    font-size: 20px;
    color: #333;
}


        /* 超薦項目：統一間距與輸入框寬度 */
        .minor-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }


        .minor-item-hint {
            margin: 2px 0 4px;
            padding: 9px 12px;
            border-radius: 7px;
            background: #fff4d9;
            color: #805500;
            font-size: 14px;
            line-height: 1.5;
        }
        .minor-item-hint[hidden] { display: none !important; }

        .minor-item {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
            padding: 16px;
            border: 2px solid #8fa8bd;
            border-left: 6px solid #567b9b;
            border-radius: 9px;
            background: #f8fbfd;
            box-shadow: 0 1px 3px rgba(35, 58, 78, 0.08);
        }

        .salvation-total-count {
            margin: 4px 0 0;
            padding: 12px 16px;
            border: 2px solid #567b9b;
            border-radius: 8px;
            background: #eaf3fa;
            color: #244967;
            font-size: 18px;
            font-weight: 700;
        }

        .minor-entry {
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr);
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .minor-entry-number {
            font-weight: 700;
            color: #345d7d;
            text-align: right;
        }

        .ancestor-name-pair {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
        }

        .ancestor-address-section {
            border-top: 2px solid #c5d4e0;
            margin-top: 4px;
            padding-top: 12px;
        }

        .ancestor-address-section > .ancestor-names {
            margin: 10px 0;
        }

        .ancestor-address-section > .add-minor-name {
            margin: 0 0 12px;
        }

        .minor-names {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
            width: 100%;
        }

        .minor-names .text-input {
            width: 100%;
            min-width: 0;
        }

        /* 2-4 地基主：沿用主要住址的縣市、鄉鎮市區、詳細地址格式 */
        .minor-address-fields {
            display: grid;
            /* 縣市與鄉鎮市區各自一組標籤＋選單，兩組固定同一排 */
            grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .minor-address-fields > .ground-city,
        .minor-address-fields > .ground-district {
            width: 100%;
            min-width: 0;
        }

        .same-main-address-option {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0 2px;
            font-weight: 600;
        }

        .minor-main-address-display {
            grid-column: 1 / -1;
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #9bb6d8;
            border-radius: 8px;
            background: #f0f6ff;
            color: #24456f;
            overflow-wrap: anywhere;
        }

        .minor-address-fields .detail-address-row {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 100px minmax(0, 1fr);
            align-items: center;
            gap: 8px;
        }

        .minor-address-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ground-address-entry + .ground-address-entry {
            border-top: 1px solid #b8c8d6;
            padding-top: 12px;
        }

        .minor-address-list { counter-reset: address-entry; }
        .ground-address-entry { counter-increment: address-entry; }
        .ground-address-entry::before {
            content: counter(address-entry) ".";
            grid-column: 1 / -1;
            color: #345d7d;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .ancestor-name-pair { grid-template-columns: minmax(0, 1fr); }
        }

        /* 2-5：每組歿者與陽上報恩人都有獨立編號 */
        .minor-names[data-item="2-5"] {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .minor-names[data-item="2-5"] .minor-entry {
            display: grid;
            grid-template-columns: 28px minmax(0, 1fr);
            align-items: start;
            gap: 8px;
        }

        .minor-names[data-item="2-5"] .deceased-pair {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 8px;
            min-width: 0;
        }

        .minor-names[data-item="2-8"] {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }

        .minor-names[data-item="2-8"] select {
            width: auto;
            min-width: 90px;
        }

        @media (max-width: 480px) {
            .contact-row {
                flex-direction: column;
                gap: 0;
            }

            .minor-names[data-item="2-5"] .deceased-pair {
                grid-template-columns: minmax(0, 1fr);
            }
            .ancestor-name-pair { grid-template-columns: minmax(0, 1fr); }

            .contact-address-section {
                padding: 14px;
            }

            .minor-address-fields {
                grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr);
                column-gap: 5px;
                font-size: 13px;
            }

            .minor-address-fields .detail-address-row {
                grid-template-columns: 88px minmax(0, 1fr);
            }
        }


        /* 牌位類別：以獨立醒目區塊呈現 */
        .tablet-category-section {
            padding: 18px;
            border: 3px solid #2457a7;
            border-radius: 14px;
            background: linear-gradient(135deg, #edf5ff 0%, #ffffff 100%);
            box-shadow: 0 4px 12px #2457a71c;
            margin-bottom: 22px;
        }

        .tablet-category-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            color: #173f7d;
            font-size: 20px;
            font-weight: 800;
        }

        .tablet-category-heading::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 25px;
            border-radius: 5px;
            background: #2457a7;
        }

        .tablet-category-heading span {
            padding: 3px 9px;
            border-radius: 999px;
            background: #d8e8ff;
            color: #2457a7;
            font-size: 13px;
            font-weight: 700;
        }

        .category-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .category-options label {
            display: flex;
            align-items: center;
            gap: 9px;
            min-height: 48px;
            padding: 11px 12px;
            border: 1px solid #a9c5e8;
            border-radius: 9px;
            background: #fff;
            color: #24456f;
            font-weight: 700;
            cursor: pointer;
            transition: border-color .15s ease, background .15s ease;
        }

        .category-options label:has(input:checked) {
            border: 2px solid #2457a7;
            background: #dceaff;
            color: #173f7d;
            box-shadow: inset 0 0 0 1px #2457a71a;
        }

        .category-options input[type="radio"] {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: #2457a7;
            flex-shrink: 0;
        }

        /* 消災姓名統計：加大數字並使用醒目卡片 */
        .disaster-name-count {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding: 14px 12px;
            border: 2px solid #d28a19;
            border-radius: 12px;
            background: #fff4d9;
            color: #784500;
            box-shadow: 0 3px 9px #a96b141c;
            text-align: center;
        }

        .disaster-count-label {
            font-size: 16px;
            font-weight: 800;
        }

        .disaster-count-value {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 48px;
            min-height: 44px;
            padding: 2px 10px;
            border-radius: 9px;
            background: #a95e00;
            color: #fff;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        .disaster-count-unit {
            font-size: 16px;
            font-weight: 800;
        }

        @media (max-width: 480px) {
            .tablet-category-section {
                padding: 13px;
            }

            .tablet-category-heading {
                font-size: 18px;
            }

            .category-options {
                gap: 8px;
            }

            .category-options label {
                padding: 10px 8px;
                font-size: 14px;
            }

            .disaster-name-count {
                gap: 6px;
                padding: 12px 8px;
            }

            .disaster-count-value {
                min-width: 42px;
                min-height: 40px;
                font-size: 25px;
            }
        }

    

    /* 查詢或修改資料：加強區塊辨識度 */
    #editSection {
      margin-top: 28px;
      padding: 22px;
      border: 2px solid #4b78b8;
      border-left: 7px solid #2457a7;
      border-radius: 14px;
      background: linear-gradient(135deg, #f0f6ff 0%, #ffffff 100%);
      box-shadow: 0 4px 14px rgba(36, 87, 167, 0.12);
    }

    #editSection > label[for="searchPhone"] {
      display: block;
      margin: 0 0 10px;
      color: #173f7d;
      font-size: 1.08rem;
      font-weight: 700;
    }

    #searchPhone {
      display: block;
      width: 100%;
      max-width: 460px;
      box-sizing: border-box;
      margin: 0 0 14px;
      padding: 12px 14px;
      border: 1px solid #9db8dc;
      border-radius: 9px;
      background: #fff;
      font-size: 1rem;
    }

    #searchPhone:focus {
      outline: 3px solid rgba(36, 87, 167, 0.18);
      border-color: #2457a7;
    }

    #searchButton {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 11px 20px;
      border: 0;
      border-radius: 9px;
      background: #2457a7;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 7px rgba(36, 87, 167, 0.2);
    }

    #searchButton:hover {
      background: #173f7d;
    }

    #searchButton:focus-visible {
      outline: 3px solid #8eb7f0;
      outline-offset: 3px;
    }

    #searchResults,
    #editForm {
      margin-top: 18px;
    }

    @media (max-width: 480px) {
      #editSection {
        padding: 16px;
      }

      #searchPhone,
      #searchButton {
        width: 100%;
        max-width: none;
      }
    }

</style>
</head>

<body>
    <h1><span>三德精舍</span><span>法會牌位登記表</span></h1>
<!-- 修改登記資料區域 -->

    <form id="registrationForm">
        
<div class="field tablet-category-section">
    <div class="tablet-category-heading">牌位類別 <span>請擇一</span></div>
    <div class="category-options">
        <label>
            <input type="radio" name="tabletCategory" value="大牌位" required>
            大牌位
        </label>

        <label>
            <input type="radio" name="tabletCategory" value="中牌位">
            中牌位
        </label>

        <label>
            <input type="radio" name="tabletCategory" value="小牌位">
            小牌位
        </label>

        <label>
            <input type="radio" name="tabletCategory" value="全家小牌位">
            全家小牌位
        </label>
    </div>
</div>


<div class="contact-address-section">
    <h3 class="section-title">登記人資料</h3>

    <div class="contact-row">
        <div class="field">
            <label for="name">寫牌位者：</label>
            <input
                class="text-input"
                type="text"
                id="name"
                name="name"
                placeholder="請輸入寫牌位者姓名"
                required
            >
        </div>

        <div class="field">
            <label for="phone">聯絡電話：</label>
            <input
                class="text-input"
                type="tel"
                id="phone"
                name="phone"
                placeholder="請輸入聯絡電話"
                required
            >
        </div>
    </div>

    <div class="field">
        <label>主要住址：</label>

        <div class="address-group">
            <label for="city">縣市：</label>
            <select class="text-input" id="city" name="city" required>
                <option value="">請選擇縣市</option>
            </select>

            <label for="district">鄉鎮市區：</label>
            <select class="text-input" id="district" name="district" required disabled>
                <option value="">請先選擇縣市</option>
            </select>

            <div class="detail-address-row">
                <label for="detailAddress">詳細地址：</label>
                <input
                    class="text-input detail-address-input"
                    type="text"
                    id="detailAddress"
                    name="detailAddress"
                    placeholder="請輸入路名、巷弄、門牌號碼"
                    required
                >
            </div>
        </div>
    </div>

</div>

</div>



        <div class="field">
            <div class="section-title">登記項目（可複選）：</div>

            <div class="major-items">
                <label class="major-option">
                    <input
                        type="checkbox"
                        name="majorItem"
                        value="消災"
                        id="disaster"
                    >
                    <span>消災</span>
                </label>

                <div class="disaster-area">
                    <div class="disaster-area-title">消災姓名：</div>

                    <div id="disasterNames">
                        
<div class="name-row">
    <span class="name-number">1.</span>
    <input
        class="text-input"
        type="text"
        name="disasterName"
        placeholder="請輸入姓名"
    >

    <div class="disaster-address-options">
        <label>
            <input type="radio" name="disasterAddressType_0" value="main" checked>
            同主要住址
        </label>

        <div class="main-address-display">
            尚未填寫主要住址

// 統計已勾選的超薦類別中，實際填寫的敬薦人／陽上報恩人／寵物名稱數量。
function updateSalvationTotalCount() {
    let total = 0;
    const countFilled = function (selector) {
        document.querySelectorAll(selector).forEach(function (input) {
            if (input.value.trim() !== "") total++;
        });
    };
    const isChecked = function (itemId) {
        const checkbox = document.querySelector('.minor-item input[name="minorItem"][value^="' + itemId + '"]');
        return Boolean(checkbox && checkbox.checked);
    };

    if (isChecked("2-1")) countFilled('.minor-names[data-item="2-1"] .minor-name-input');
    if (isChecked("2-2")) countFilled('.minor-names[data-item="2-2"] .minor-name-input');
    if (isChecked("2-3")) countFilled('.ancestor-address-list[data-item="2-3"] .ancestor-benefactor');
    if (isChecked("2-4")) countFilled('.minor-address-list[data-item="2-4"] .ground-recommender');
    if (isChecked("2-5")) countFilled('.minor-names[data-item="2-5"] .deceased-pair input:nth-child(2)');
    if (isChecked("2-6")) countFilled('.minor-names[data-item="2-6"] .minor-name-input');
    if (isChecked("2-7")) countFilled('.minor-names[data-item="2-7"] .minor-name-input');

    const display = document.getElementById("salvationTotalCount");
    if (display) display.textContent = "超薦總數量：" + total + " 位";
}

document.addEventListener("input", function (event) {

            const selectedMajorItems = Array.from(
                document.querySelectorAll('input[name="majorItem"]:checked')
            ).map(function (checkbox) {
                return checkbox.value;
            });

            const selectedMinorItems = Array.from(
                document.querySelectorAll('input[name="minorItem"]:checked')
            ).map(function (checkbox) {
                return checkbox.value;
            });

            if (selectedMajorItems.length === 0) {
                message.textContent = "請至少勾選一個登記項目。";
                return;
            }

            const names = Array.from(
                document.querySelectorAll('input[name="disasterName"]')
            ).map(function (input) {
                return input.value.trim();
            }).filter(Boolean);

            if (selectedMajorItems.includes("消災") && names.length === 0) {
                message.textContent = "已勾選消災，請至少填寫一位消災姓名。";
                return;
            }

            const itemDetails = [];

            if (selectedMajorItems.includes("消災")) {
                itemDetails.push("消災（姓名：" + names.join("、") + "）");
            }

            if (selectedMajorItems.includes("超薦")) {
                itemDetails.push(
                    "超薦" +
                    (selectedMinorItems.length
                        ? "（" + selectedMinorItems.join("、") + "）"
                        : "")
                );
            }

            // 逐筆建立消災、超薦及普桌明細；每筆明細由 Apps Script 配發全類別共用的連續 MD 流水號。
            const mainAddress = [
                document.getElementById("city").value,
                document.getElementById("district").value,
                document.getElementById("detailAddress").value.trim()
            ].filter(Boolean).join("");

            const disasterEntries = selectedMajorItems.includes("消災")
                ? Array.from(document.querySelectorAll("#disasterNames .name-row")).map(function (row) {
                    const nameInput = row.querySelector('input[name="disasterName"]');
                    if (!nameInput || !nameInput.value.trim()) return null;
                    const selectedAddressType = row.querySelector('input[type="radio"]:checked');
                    const otherAddressInput = row.querySelector(".other-address-input");
                    const address = selectedAddressType && selectedAddressType.value === "other"
                        ? (otherAddressInput ? otherAddressInput.value.trim() : "")
                        : mainAddress;
                    return { name: nameInput.value.trim(), address: address || mainAddress };
                }).filter(Boolean)
                : [];

            const details = [];
            const isMinorSelected = function (prefix) {
                return selectedMinorItems.some(function (value) { return value.indexOf(prefix) === 0; });
            };
            const addSimpleMinorDetails = function (itemId, category, role) {
                if (!isMinorSelected(itemId)) return;
                document.querySelectorAll('.minor-names[data-item="' + itemId + '"] .minor-name-input').forEach(function (input) {
                    const value = input.value.trim();
                    if (value) details.push({ category: category, name: value, role: role, address: "" });
                });
            };
            const readAddress = function (entry, sameMainSelector) {

                if (sameMain && sameMain.checked) return mainAddress;
                const city = entry.querySelector(".ground-city");
                const district = entry.querySelector(".ground-district");
                const detail = entry.querySelector(".ground-detail-address");
                return [city ? city.value : "", district ? district.value : "", detail ? detail.value.trim() : ""].filter(Boolean).join("");
            };

            if (selectedMajorItems.includes("消災")) {
                disasterEntries.forEach(function (entry) {
                    details.push({ category: "消災", name: entry.name, role: "消災姓名", address: entry.address || mainAddress });
                });
            }
            if (selectedMajorItems.includes("超薦")) {
                addSimpleMinorDetails("2-1", "2-1 個人累世冤親債主", "敬薦人");

                        const address = readAddress(entry);
                        // 每一個姓名輸入框各自建立一列，祖先姓氏與陽上報恩人不共用同一列。
                        if (surname.trim()) {
                            details.push({ category: "2-3 歷代祖先", name: surname.trim(), role: "祖先姓氏", address: address });
                        }
                        if (benefactor.trim()) {
                            details.push({ category: "2-3 歷代祖先", name: benefactor.trim(), role: "陽上報恩人", address: address });

                        else if (address) details.push({ category: "2-4 地基主", name: "地基主", role: "地基主", address: address });

                        if (benefactor) details.push({ category: "2-5 已過世親人（歿）", name: benefactor, role: "陽上報恩人", address: "" });

                    for (let i = 1; i <= tableCount; i++) {

            };

            try {
                await fetch(scriptUrl, {

document.getElementById("saveEditButton").addEventListener("click", async function () {
    const rowNumber = Number(document.getElementById("editRowNumber").value);
    const phone = document.getElementById("editPhone").value.trim();

    if (!rowNumber || !phone) {
        alert("請確認資料列與聯絡電話已填寫。");
        return;
    }

    const data = {
        action: "update",
        adminPassword: document.getElementById("editAdminPassword").value,
        rowNumber: rowNumber,
        name: document.getElementById("editName").value.trim(),
        phone: phone,
        item: document.getElementById("editItem").value.trim(),
        disasterName: document.getElementById("editDisasterName").value.trim(),
        address: document.getElementById("editAddress").value.trim(),
        tabletCategory: document.getElementById("editTabletCategory").value
    };

    if (!confirm("確定要儲存這筆資料的修改嗎？")) {
        return;
    }

    const button = document.getElementById("saveEditButton");
    button.disabled = true;

    try {
        await fetch(
            "https://script.google.com/macros/s/AKfycbz4g-ZR30EtkX3YF45AE9v8tPjmR342sexiPP5JsJbDL57gN3NYxc2j4rUHSzM8z65k/exec",
            {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify(data)
            }
        );

        alert("修改資料已送出，請到 Google 試算表確認是否更新成功。");
        document.getElementById("editForm").style.display = "none";
    } catch (error) {
        alert("送出失敗，請檢查網路連線後再試。");
    } finally {
        button.disabled = false;
    }
});

document.getElementById("cancelEditButton").addEventListener("click", function () {
    document.getElementById("editForm").style.display = "none";
});
